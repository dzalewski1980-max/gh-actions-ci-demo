name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: install deps
        run: pip install -r requirements.txt

      - name: run tests
        run: pytest
     
      - name: build docker image
        run: docker build -t my-app