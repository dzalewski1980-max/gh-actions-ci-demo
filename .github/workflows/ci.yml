name: CI

on:
  push:
    branches: [main]


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: install deps
        run: pip install -r requirements.txt

      - name: run tests
        run: pytest
     
      - name: build docker image
        run: docker build -t my-app .
        
      - name: login to dockerhub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: tag image
        run: docker tag my-app ${{ secrets.DOCKER_USERNAME }}/gh-demo-app:latest

      - name: push image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/gh-demo-app:latest
